[project]
name = "resumelens"
version = "1.0.0"
description = "ResumeLens: AI resume screening agent (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "scikit-learn>=1.4",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.vercel]
entrypoint = "app.main:app"
